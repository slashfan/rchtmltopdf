[package]
name = "rchtmltopdf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "wkhtmltopdf-compatible CLI, modern Chromium rendering"

[lib]
path = "src/lib.rs"

[[bin]]
name = "rchtmltopdf"
path = "src/main.rs"

[dependencies]
rchtmltopdf-browser = { version = "0.2.0", path = "../browser" }
rchtmltopdf-core.workspace = true
rchtmltopdf-pdf = { version = "0.2.0", path = "../pdf" }
tokio = { version = "1.53.1", features = ["rt", "macros"] }
