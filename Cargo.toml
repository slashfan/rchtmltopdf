[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/cli",
    "crates/browser",
    "crates/pdf",
    "crates/conformance",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/slashfan/rchtmltopdf"
description = "wkhtmltopdf-compatible CLI, modern Chromium rendering"

[workspace.dependencies]
rchtmltopdf-core = { path = "crates/core", version = "0.2.0" }

[profile.release]
lto = "thin"
strip = true
