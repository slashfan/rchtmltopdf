name: Bug report
description: Something is broken that is not a wkhtmltopdf compatibility difference
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected instead
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include the command line and any input file.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: rchtmltopdf version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
