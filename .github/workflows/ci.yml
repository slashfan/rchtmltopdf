name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `edited` matters: without it, fixing a bad PR title never re-runs the
    # title check, and a required check that never re-reports is a deadlock.
    types: [opened, edited, reopened, synchronize]

# Least privilege. No job here needs more; `pr-title` adds one read at job level.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded pull request runs, never a push to main. A cancelled main
  # run leaves a half-written cache entry and an ambiguous commit status.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # `-D warnings` belongs on the invocation, not in a global RUSTFLAGS.
      # Global RUSTFLAGS splits the cache and makes cargo test fail on a
      # dependency's warnings.
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test
    strategy:
      fail-fast: false
      matrix:
        # macOS is not decoration: D09 resolves application bundles there, and
        # `locate` is the one module whose behaviour is genuinely per-platform.
        # It was Linux only while the repository was private, because macOS
        # runners bill at ten times the Linux rate; public runners are free
        # (D28).
        #
        # Windows is absent and cannot be added. `crates/browser` carries a
        # `compile_error!` for anything that is not Unix, because the protocol
        # travels on file descriptors 3 and 4 and the Windows handle transport is
        # not written. D23 asked for it; D23 was wrong.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Turn "no browser here, skipping" into a failure. Both runner images ship
      # a browser, and browser-backed tests silently skipping when one stops
      # doing so is exactly the rot this variable exists to prevent: eighteen
      # tests would stop running and CI would stay green.
      RCHTMLTOPDF_REQUIRE_CHROMIUM: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with: { toolchain: stable }

      # Linux only, and written from a step rather than declared in `env`,
      # because the tests ask whether the variable is *set* and an expression
      # evaluating to the empty string still sets it. The Linux runner restricts
      # user namespaces, so Chromium refuses to start rather than run
      # unsandboxed; macOS has no such problem and therefore exercises the
      # sandbox, which is the arrangement the product actually ships (D10).
      - name: This runner cannot give Chromium a sandbox
        if: runner.os == 'Linux'
        run: echo "RCHTMLTOPDF_TEST_NO_SANDBOX=1" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # Conformance is excluded and runs in `chromium` instead. It asserts on
      # rendered output, so it insists on the pinned browser, and this job is
      # deliberately pointed at whatever Chromium the runner image ships.
      - run: cargo test --workspace --all-features --locked --exclude rchtmltopdf-conformance

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # Must match `rust-version` in the workspace Cargo.toml.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with: { toolchain: "1.88.0" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `check`, not `test`: dev-dependencies routinely need a newer compiler
      # than the library itself, and pinning the test tooling to the MSRV is not
      # the promise being made. Conformance is excluded for the same reason —
      # nobody compiles the harness.
      #
      # The floor itself is lopdf's, not ours (D30). It requires 1.88, and D12
      # chose it for the PDF layer, so the choice was between carrying an old
      # PDF library to protect a number nobody had asked for and moving the
      # number. This job is what stopped that happening quietly.
      - run: cargo check --workspace --all-targets --locked --exclude rchtmltopdf-conformance

  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --workspace --no-deps

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # Bans, licences and sources only. These are a pure function of
      # Cargo.lock, so they are deterministic and safe to require on a pull
      # request. Advisories are deliberately NOT here: they are time-dependent,
      # and a new entry published on a Tuesday must not turn every unrelated
      # pull request red. They run on a schedule in audit.yml instead.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check bans licenses sources

  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # Merges are squashed with the pull request title as the commit subject,
      # so linting the title is how the commit log stays conventional. Commits
      # inside a branch stay unconstrained on purpose.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            compat
            perf
            docs
            refactor
            test
            ci
            build
            chore
          scopes: |
            ci
            cli
            core
            browser
            pdf
            table
            conformance
            docker
            pkg
            deps
          requireScope: false

  # Conformance: the real binary, a real browser, a pinned one (D15).
  #
  # Separate from `test` on purpose. `test` runs against whatever Chromium the
  # runner image happens to ship, which is right for the browser crate's own
  # tests — they assert on behaviour any Chromium has. This job pins the version
  # instead, because the conformance suite asserts on rendered output, and page
  # count moves with the renderer.
  chromium:
    name: chromium
    # Do not spend a browser download on code that does not compile.
    needs: [clippy]
    runs-on: ubuntu-latest
    env:
      # Turn "no browser here, skipping" into a failure. Without it a pin that
      # stopped arriving would make the whole suite pass by not running.
      RCHTMLTOPDF_REQUIRE_CHROMIUM: "1"
      # The runner restricts user namespaces, so Chromium refuses to start rather
      # than run unsandboxed. A property of the runner, never a default for the
      # product (D10).
      RCHTMLTOPDF_TEST_NO_SANDBOX: "1"
      # Points D09's last rung at a path inside the workspace, so the browser can
      # be cached between runs and so the cache rung is what gets exercised.
      RCHTMLTOPDF_CACHE_DIR: ${{ github.workspace }}/.chromium-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      # Naming the browser explicitly is not belt and braces, it is required.
      # D09 puts system locations *above* the download cache, and this runner
      # ships its own `/usr/bin/chromium`, so without this the job downloads the
      # pin and then resolves past it — which is what happened the first time
      # this job ran. `RCHTMLTOPDF_CHROMIUM` is D09's second rung, so the ladder
      # is still what resolves the browser; it is only being told which one.
      #
      # The harness checks the resolved browser's version against the pin
      # whenever RCHTMLTOPDF_REQUIRE_CHROMIUM is set, so this line rotting is a
      # test failure rather than a suite that quietly stops being pinned.
      - name: Read the pin
        id: pin
        run: |
          set -euo pipefail
          version="$(cat .chromium-version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "RCHTMLTOPDF_CHROMIUM=${RCHTMLTOPDF_CACHE_DIR}/${version}/chrome-headless-shell-linux64/chrome-headless-shell" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browser
        with:
          path: ${{ github.workspace }}/.chromium-cache
          key: chromium-${{ runner.os }}-${{ hashFiles('.chromium-version') }}

      # This step is where the download lives, and it is staying here (D31). The
      # binary will not fetch a browser: doing so would put a TLS stack, a
      # checksum and an archive unpacker inside it, and CI is the one place that
      # already has curl, a shell and a cache.
      #
      # The unpacked layout below is the contract with `locate`, which looks for
      # exactly this path under RCHTMLTOPDF_CACHE_DIR. The archive already has
      # the versioned folder inside it.
      - name: Download the pinned Chrome for Testing
        if: steps.browser.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.pin.outputs.version }}
        run: |
          set -euo pipefail
          target="${RCHTMLTOPDF_CACHE_DIR}/${VERSION}"
          mkdir -p "$target"
          curl --fail --silent --show-error --location --retry 3 \
            -o /tmp/headless-shell.zip \
            "https://storage.googleapis.com/chrome-for-testing-public/${VERSION}/linux64/chrome-headless-shell-linux64.zip"
          unzip -q /tmp/headless-shell.zip -d "$target"
          chmod +x "$target/chrome-headless-shell-linux64/chrome-headless-shell"

      # No fonts are installed on purpose. Every fixture carries its own font as
      # a data: URI, so what this runner has installed is deliberately not part
      # of the contract; a fixture that started depending on a system font should
      # become visible rather than be propped up here.

      # `cargo test -p` builds that package's dependencies as libraries and not
      # their binaries, so the binary under test has to be asked for by name.
      - run: cargo build -p rchtmltopdf --locked
      - run: cargo test -p rchtmltopdf-conformance --locked

  # The version in Cargo.toml commands publication (release.yml, D50), so a
  # pull request says what its merge will publish, and a version that moves
  # back below the latest release is refused: a published version is not taken
  # back, and the merge would publish nothing, silently.
  version:
    name: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The tags: they are what the version is compared against.
          fetch-depth: 0
      - name: The version does not move back, and announces what it will publish
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          latest="$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -1)"

          if [ -z "$latest" ]; then
            echo "::notice::no published version yet: merging will publish v${version}."
            exit 0
          fi

          # `sort -V` compares version numbers, not text: without it, "0.10.0"
          # would look older than "0.9.0".
          oldest="$(printf '%s\n%s\n' "$version" "$latest" | sort -V | head -1)"
          if [ "$version" != "$latest" ] && [ "$oldest" = "$version" ]; then
            echo "::error::Cargo.toml announces ${version}, below the latest release v${latest}. A published version is not taken back: the merge would publish nothing, silently."
            exit 1
          fi

          if [ "$version" = "$latest" ]; then
            echo "::notice::version ${version} is unchanged: merging will publish no release."
          else
            echo "::notice::merging will publish v${version}."
          fi

  # The single required status check. Every other job feeds this one, so the
  # branch ruleset never has to be edited when a job is added, renamed or split.
  # `if: always()` plus the explicit result test is what makes skipped jobs (such
  # as pr-title on a push) pass rather than deadlock the merge button.
  ci:
    name: ci
    if: always()
    needs: [fmt, clippy, test, chromium, msrv, docs, deny, pr-title, version]
    runs-on: ubuntu-latest
    steps:
      - name: Check that every required job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
