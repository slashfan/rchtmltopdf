name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `edited` matters: without it, fixing a bad PR title never re-runs the
    # title check, and a required check that never re-reports is a deadlock.
    types: [opened, edited, reopened, synchronize]

# Least privilege. No job here needs more; `pr-title` adds one read at job level.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded pull request runs, never a push to main. A cancelled main
  # run leaves a half-written cache entry and an ambiguous commit status.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # `-D warnings` belongs on the invocation, not in a global RUSTFLAGS.
      # Global RUSTFLAGS splits the cache and makes cargo test fail on a
      # dependency's warnings.
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test
    strategy:
      fail-fast: false
      matrix:
        # Linux only while the repository is private: macOS runners bill at ten
        # times the Linux rate against the plan's monthly quota. When this repo
        # goes public, runners are free, so widen this to:
        #   os: [ubuntu-latest, macos-latest, windows-latest]
        # macOS and Windows are not decoration here. D09 resolves macOS
        # application bundles, and the tokenizer does path work on every platform.
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The runner image ships a Chromium but cannot give it a sandbox: user
      # namespaces are restricted, and Chromium refuses to start rather than run
      # unsandboxed. Tests that launch a browser follow suit here. This is a
      # property of the runner, not a default for the product, where the sandbox
      # stays on unless a caller explicitly gives it up (D10).
      RCHTMLTOPDF_TEST_NO_SANDBOX: "1"
      # Turn "no browser here, skipping" into a failure. The runner image ships
      # a Chromium, and browser-backed tests silently skipping when it stops
      # doing so is exactly the rot this variable exists to prevent: eighteen
      # tests would stop running and CI would stay green.
      RCHTMLTOPDF_REQUIRE_CHROMIUM: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: cargo test --workspace --all-features --locked

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # Must match `rust-version` in the workspace Cargo.toml.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with: { toolchain: "1.85.0" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `check`, not `test`: dev-dependencies routinely need a newer compiler
      # than the library itself, and pinning the test tooling to the MSRV is not
      # the promise being made.
      - run: cargo check --workspace --all-targets --locked

  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --workspace --no-deps

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # Bans, licences and sources only. These are a pure function of
      # Cargo.lock, so they are deterministic and safe to require on a pull
      # request. Advisories are deliberately NOT here: they are time-dependent,
      # and a new entry published on a Tuesday must not turn every unrelated
      # pull request red. They run on a schedule in audit.yml instead.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check bans licenses sources

  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # Merges are squashed with the pull request title as the commit subject,
      # so linting the title is how the commit log stays conventional. Commits
      # inside a branch stay unconstrained on purpose.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            compat
            perf
            docs
            refactor
            test
            ci
            build
            chore
          scopes: |
            ci
            cli
            core
            browser
            pdf
            table
            docker
            pkg
            deps
          requireScope: false

  # The single required status check. Every other job feeds this one, so the
  # branch ruleset never has to be edited when a job is added, renamed or split.
  # `if: always()` plus the explicit result test is what makes skipped jobs (such
  # as pr-title on a push) pass rather than deadlock the merge button.
  ci:
    name: ci
    if: always()
    needs: [fmt, clippy, test, msrv, docs, deny, pr-title]
    runs-on: ubuntu-latest
    steps:
      - name: Check that every required job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

