name: Release

# **The version in Cargo.toml commands** (D50). A merge to main that brings a
# version with no tag yet is published from that commit: binaries, image,
# release, checksums. Nothing is pushed by hand, so nothing can be forgotten,
# and what the binary announces cannot drift from what is published.
#
# A hand-pushed tag is still accepted, to republish, but it must match
# Cargo.toml or nothing is built.
#
# Pull requests that could break the build run it without publishing, because a
# release workflow that has never run is a release workflow that does not work,
# and the first time to find that out is not the merge that publishes.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Dockerfile"
      - ".dockerignore"
      - ".chromium-version"
      - "Cargo.lock"
      - "**/Cargo.toml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# Two close merges must not publish at the same time, and neither is cancelled:
# a half-made release would be worse than two that follow each other.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The tags, to know whether this version's already exists.
          fetch-depth: 0

      - name: Decide whether this run publishes
        id: decide
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # A tag that does not match would publish binaries announcing a
            # version other than their own. Stop before building anything.
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match version ${version} in Cargo.toml"
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::tag ${tag}: publishing."
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "::notice::version ${version} is already published as ${tag}: nothing to do."
            else
              echo "release=true" >> "$GITHUB_OUTPUT"
              echo "::notice::version ${version} has no tag: publishing ${tag}."
            fi
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${GITHUB_EVENT_NAME}: building only, publishing nothing."
          fi

  build:
    name: ${{ matrix.name }}
    needs: version
    # An ordinary merge to main does not change the version, and there is no
    # point building four targets for nothing.
    if: needs.version.outputs.release == 'true' || github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          # **Native runners, no emulation.** Cross-building aarch64 under qemu
          # works and takes an order of magnitude longer, and a binary nobody has
          # run on the architecture it claims to support is not evidence of
          # anything. Arm runners are free on a public repository (D28).
          #
          # musl produces a static binary, which starts on any distribution,
          # including a server whose glibc is older than the runner's.
          - name: rchtmltopdf-linux-x86_64
            target: x86_64-unknown-linux-musl
            runs-on: ubuntu-latest
            smoke: true
          - name: rchtmltopdf-linux-aarch64
            target: aarch64-unknown-linux-musl
            runs-on: ubuntu-24.04-arm
            smoke: true
          - name: rchtmltopdf-macos-arm64
            target: aarch64-apple-darwin
            runs-on: macos-latest
            smoke: true
          # Cross-compiled from an arm64 runner, so it cannot be run here to
          # prove itself. The one exception to the rule above, and a documented
          # one: an Intel Mac runner costs money and Apple stopped making them.
          - name: rchtmltopdf-macos-x86_64
            target: x86_64-apple-darwin
            runs-on: macos-latest
            smoke: false
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # Rust links musl self-contained these days and this is usually redundant.
      # It is also two seconds, and the failure it prevents is a linker error at
      # publishing time.
      - name: Install the musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends musl-tools

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Only the binary crate. The conformance harness is not shipped and needs a
      # browser nobody is going to give it here.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --package rchtmltopdf

      # **Asserted, not assumed.** "Static" is the whole point of a musl build:
      # it is what lets the binary drop into a distroless image or a VM whose
      # glibc is older than the runner's. A dynamically linked one would work on
      # CI and fail in the place it was built for.
      #
      # **The two targets do not produce the same thing**, which the first
      # version of this check did not know and failed on:
      #
      #   x86_64   ELF 64-bit LSB pie executable, …, static-pie linked
      #   aarch64  ELF 64-bit LSB executable,     …, statically linked
      #
      # Both are static. The x86_64 one is also position independent, so it gets
      # address space layout randomisation and the other does not — a difference
      # in Rust's defaults per target rather than anything asked for here.
      #
      # So the test is what must *not* be true: no dynamic linking, and no
      # interpreter to go looking for one.
      - name: Check that it is genuinely static
        if: endsWith(matrix.target, '-musl')
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/rchtmltopdf"
          described=$(file "$binary")
          echo "$described"
          case "$described" in
            *"dynamically linked"*) echo "::error::dynamically linked"; exit 1 ;;
            *interpreter*) echo "::error::needs a dynamic loader"; exit 1 ;;
          esac
          case "$described" in
            *"statically linked"*|*"static-pie linked"*) ;;
            *) echo "::error::not recognisably static: $described"; exit 1 ;;
          esac

      - name: Check that it runs
        if: matrix.smoke
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/rchtmltopdf"
          "$binary" --version
          # Exits 1 on a runner with no browser, which is the ordinary case here
          # and still proves the binary starts and resolves.
          "$binary" --dump-chromium || true

      # **The archive name carries no version**: that is what makes
      # `releases/latest/download/rchtmltopdf-linux-x86_64.tar.gz` a URL worth
      # writing down. The version is on the directory inside, so what was
      # unpacked still says what it is.
      #
      # **tar, never zip.** The archive carries a `wkhtmltopdf` symlink so a
      # drop-in replacement is a drop-in replacement (D13), and zip has no
      # portable way to hold one — it would arrive as a copy, or as a text file
      # containing a path.
      - name: Assemble the archive
        id: archive
        run: |
          set -euo pipefail
          if [ "${{ needs.version.outputs.release }}" = true ]; then
            version="${{ needs.version.outputs.version }}"
          else
            # A trial build. Nothing ties it to a published version, and the
            # commit is the only honest marker.
            version="$(git rev-parse --short HEAD)"
          fi
          inner="${{ matrix.name }}-${version}"
          echo "inner=$inner" >> "$GITHUB_OUTPUT"

          mkdir -p "dist/$inner"
          cp "target/${{ matrix.target }}/release/rchtmltopdf" "dist/$inner/"
          ln -s rchtmltopdf "dist/$inner/wkhtmltopdf"
          # The licences require their notice to accompany every copy, so they
          # travel with the binary.
          cp README.md LICENSE-MIT LICENSE-APACHE CHANGELOG.md "dist/$inner/"
          tar -C dist -czf "dist/${{ matrix.name }}.tar.gz" "$inner"

      # The symlink is the reason for tar, so whether it survived is worth
      # knowing here rather than from somebody who unpacked a release.
      - name: Check that the symlink survived
        run: |
          set -euo pipefail
          mkdir -p check && tar -C check -xzf "dist/${{ matrix.name }}.tar.gz"
          link="check/${{ steps.archive.outputs.inner }}/wkhtmltopdf"
          test -L "$link" || { echo "::error::wkhtmltopdf is not a symlink"; exit 1; }
          test "$(readlink "$link")" = "rchtmltopdf" \
            || { echo "::error::wkhtmltopdf points somewhere unexpected"; exit 1; }
          if [ "${{ matrix.smoke }}" = true ]; then "$link" --version; fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}.tar.gz
          if-no-files-found: error

  # **Built on a runner of its own architecture and merged into one manifest**,
  # for the same reason as the binaries: a browser image nobody has run on the
  # architecture it claims to support proves nothing, and qemu is an order of
  # magnitude slower at proving it (D32).
  image:
    name: image ${{ matrix.arch }}
    needs: version
    if: needs.version.outputs.release == 'true' || github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
            chromium: linux64
          - arch: arm64
            runs-on: ubuntu-24.04-arm
            chromium: linux-arm64
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - name: Build
        run: |
          set -euo pipefail
          docker build \
            --build-arg "CHROMIUM_VERSION=$(cat .chromium-version)" \
            --build-arg "CHROMIUM_PLATFORM=${{ matrix.chromium }}" \
            --tag "rchtmltopdf:${{ matrix.arch }}" \
            .

      # **The recommended command, not a convenient one.** The README tells
      # people to run it with `--cap-add=SYS_ADMIN` so the browser keeps its
      # sandbox (D33); if that stopped working, the documentation would be wrong
      # and nothing else here would notice.
      - name: Convert something with it
        run: |
          set -euo pipefail
          printf '<!doctype html><meta charset=utf-8><title>t</title><h1>SMOKE</h1>' > page.html
          docker run --rm -i --cap-add=SYS_ADMIN "rchtmltopdf:${{ matrix.arch }}" - - \
            < page.html > out.pdf
          head -c 5 out.pdf | grep -q '%PDF-' || { echo "::error::not a PDF"; exit 1; }

          # D13: the symlink is the point of a drop-in replacement.
          docker run --rm -i --cap-add=SYS_ADMIN --entrypoint wkhtmltopdf \
            "rchtmltopdf:${{ matrix.arch }}" - - < page.html > as-wkhtmltopdf.pdf
          head -c 5 as-wkhtmltopdf.pdf | grep -q '%PDF-' \
            || { echo "::error::the wkhtmltopdf symlink does not convert"; exit 1; }

          # And that the browser resolves with no flags at all (D09).
          docker run --rm "rchtmltopdf:${{ matrix.arch }}" --dump-chromium

      # **And that it refuses to convert unsandboxed without being asked**,
      # which is the decision this image is built on rather than an accident of
      # how Docker is configured (D33).
      - name: Check that a plain run refuses rather than converting unsafely
        run: |
          set -euo pipefail
          printf '<!doctype html><meta charset=utf-8><title>t</title><h1>x</h1>' > page.html
          if docker run --rm -i "rchtmltopdf:${{ matrix.arch }}" - - < page.html > /dev/null 2>said.txt
          then
            echo "::error::converted with no sandbox and nobody asked for that"
            exit 1
          fi
          grep -q "sandbox" said.txt || { echo "::error::did not say why"; cat said.txt; exit 1; }
          cat said.txt

      - name: Push
        if: needs.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag "rchtmltopdf:${{ matrix.arch }}" "$image:$VERSION-${{ matrix.arch }}"
          docker push "$image:$VERSION-${{ matrix.arch }}"

  # One tag pointing at both architectures, assembled from what was pushed
  # rather than rebuilt.
  manifest:
    name: manifest
    needs: [version, image]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Merge
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create \
            --tag "$image:$VERSION" \
            --tag "$image:latest" \
            "$image:$VERSION-amd64" \
            "$image:$VERSION-arm64"
          docker buildx imagetools inspect "$image:$VERSION"

  publish:
    name: publish
    needs: [version, build, manifest]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    # The only job that can write to the repository, and it calls no third-party
    # action: publishing goes through the `gh` the runner ships.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # What it takes to check a downloaded archive: `shasum -c SHA256SUMS`.
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz | tee SHA256SUMS

      - name: Write the release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          > **A weekend project. Do not use it in production.** No support, and no
          > undertaking that any of this keeps working. See the README.

          ## This does not include a browser

          The binary drives a headless Chromium and **never downloads one** (D31). Install one
          yourself — `apt install chromium`, `brew install --cask chromium`, or a pinned
          `npx @puppeteer/browsers install chrome-headless-shell@…` — and it will be found.

          It looks, in order: `--chromium-path`, then `RCHTMLTOPDF_CHROMIUM` / `CHROME_PATH` /
          `CHROMIUM_PATH` / `PUPPETEER_EXECUTABLE_PATH`, then the usual system locations, then
          `RCHTMLTOPDF_CACHE_DIR`. That order is [D09](docs/decisions.md), and a path may be an
          executable, a directory it was unpacked into, or a macOS `.app` bundle.

          `rchtmltopdf --dump-chromium` says which one it would use and where it found it.

          ## The archives

          The Linux ones are statically linked against musl, so they run wherever the kernel
          does — including a distroless image or a machine whose glibc predates the one they
          were built on. The macOS ones are unsigned: fetched with `curl` they run without fuss,
          and one downloaded through a browser needs `xattr -d com.apple.quarantine` first. Each
          carries a `wkhtmltopdf` symlink, which is why they are tars rather than zips.

          Verify with `shasum -c SHA256SUMS`. The image is
          `ghcr.io/slashfan/rchtmltopdf`, tagged with this version and `latest`.

          NOTES
          # Then this version's section of the changelog, if it has one: from its
          # heading, exclusive, to the next heading or the end of the file.
          awk -v v="$VERSION" '/^## \[/{p=($0 ~ "^## \\[" v "\\]")} p' CHANGELOG.md \
            | sed '1d' >> notes.md

      # `gh release create` lays the tag itself on `--target` when it does not
      # exist yet: that is what makes the merge sufficient, without a workflow
      # pushing a tag. A tag created by the workflow token triggers no run, so
      # this cannot publish twice.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --target "$GITHUB_SHA" \
            --notes-file notes.md \
            dist/*.tar.gz dist/SHA256SUMS
